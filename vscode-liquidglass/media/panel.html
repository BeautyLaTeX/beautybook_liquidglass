<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{SOURCE}}; script-src 'nonce-{{NONCE}}'">
  <link rel="stylesheet" href="{{CSS}}">
  <title>LiquidGlass 编译面板</title>
</head>
<body>
  <main>
    <section class="instrument" aria-label="编译状态">
      <div class="file-row">
        <span class="file-icon" aria-hidden="true"></span>
        <span id="file">选择一个 .tex 文件</span>
      </div>
      <div class="gauge" id="gauge" role="progressbar" aria-label="编译进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas id="dial" aria-hidden="true"></canvas>
        <div class="gauge-value" aria-hidden="true"><span id="percent">0</span><span class="percent-unit">%</span></div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span><span id="phase">等待编译</span>
      </div>
      <p id="detail" hidden></p>
    </section>

    <fieldset id="engines" class="engines">
      <legend>编译引擎</legend>
      <label class="engine"><input type="radio" name="engine" value="pdflatex"><span>pdfLaTeX</span></label>
      <label class="engine"><input type="radio" name="engine" value="xelatex" checked><span>XeLaTeX</span></label>
      <label class="engine"><input type="radio" name="engine" value="lualatex"><span>LuaLaTeX</span></label>
    </fieldset>

    <label class="shell">
      <span>Shell Escape</span>
      <input id="shell" type="checkbox" role="switch" aria-label="开启 Shell Escape">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <div class="actions">
      <button class="primary" id="build"><span aria-hidden="true">▶</span> 编译</button>
      <button id="cancel" hidden>停止</button>
      <button id="pdf" hidden>查看 PDF</button>
      <button class="output" id="output">输出</button>
    </div>

    <section class="errors" id="errors" hidden aria-label="编译错误">
      <h2>编译错误</h2>
      <ol id="problems"></ol>
    </section>
  </main>
  <script nonce="{{NONCE}}" src="{{JS}}"></script>
</body>
</html>
