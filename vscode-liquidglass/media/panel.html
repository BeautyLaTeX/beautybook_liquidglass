<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{SOURCE}}; img-src {{SOURCE}}; script-src 'nonce-{{NONCE}}'">
  <link rel="stylesheet" href="{{CSS}}">
  <link rel="stylesheet" href="{{FONT_CSS}}">
  <title>LiquidGlass · 编译面板</title>
</head>
<body data-initial-font-scale="{{FONT_SCALE}}">
  <main>
    <header><img src="{{ICON}}" alt=""><div><span>LiquidGlass LaTeX Studio</span><h1>编译面板</h1></div><label class="font-scale">字号 <select data-font-scale aria-label="窗口字号"></select></label></header>
    <section class="instrument" aria-label="编译进度">
      <div class="file-row"><span id="file" title="">打开一个 .tex 文件</span><span id="engine" hidden></span></div>
      <div class="dial-wrap">
        <div id="gauge" class="gauge" role="progressbar" aria-label="阶段进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <canvas id="dial" aria-hidden="true"></canvas>
          <div class="value"><span id="percent">0</span><span>%</span><small>阶段进度</small></div>
        </div>
      </div>
      <div class="current"><i aria-hidden="true"></i><strong id="phase" role="status">等待编译</strong><span id="elapsed"></span></div>
      <p id="detail" hidden></p>
      <p id="next" hidden></p>
    </section>
    <div class="build-actions"><button id="build" class="primary">编译文档</button><button id="cancel" hidden>停止</button><button id="pdf" hidden>打开 PDF</button><button id="output" class="quiet">打开日志</button></div>
    <section id="errors" class="card errors" hidden aria-labelledby="error-title">
      <div class="section-title"><h2 id="error-title">编译错误</h2><span id="error-count"></span></div>
      <ol id="problems"></ol>
    </section>
    <section class="card" id="pipeline">
      <div class="section-title"><h2>构建步骤</h2><span id="route"></span></div>
      <ol id="steps"></ol>
      <details id="history" hidden><summary>运行记录</summary><ol id="history-list"></ol></details>
    </section>
    <details class="card" id="paths" hidden><summary>文件路径</summary><dl id="path-list"></dl></details>
    <details class="card" id="preferences" open>
      <summary>编译设置</summary>
      <label class="switch"><span>沿用项目设置</span><input id="follow" type="checkbox" role="switch"><i class="toggle-track" aria-hidden="true"></i></label>
      <fieldset id="engines">
        <legend class="sr">编译引擎</legend>
        <div class="radios">
          <label><input name="engine" type="radio" value="pdflatex"><span>pdfLaTeX</span></label>
          <label><input name="engine" type="radio" value="xelatex" checked><span>XeLaTeX</span></label>
          <label><input name="engine" type="radio" value="lualatex"><span>LuaLaTeX</span></label>
        </div>
      </fieldset>
      <label class="switch"><span>Shell Escape</span><input id="shell" type="checkbox" role="switch"><i class="toggle-track" aria-hidden="true"></i></label>
    </details>
    <button id="studio" class="lab">打开材质实验室 <span aria-hidden="true">↗</span></button>
  </main>
  <div id="toast" role="status" hidden></div>
  <script nonce="{{NONCE}}" src="{{METER}}"></script><script nonce="{{NONCE}}" src="{{FONT_JS}}"></script>
  <script nonce="{{NONCE}}" src="{{JS}}"></script>
</body>
</html>
