<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{SOURCE}}; script-src 'nonce-{{NONCE}}'">
  <link rel="stylesheet" href="{{CSS}}">
  <title>LiquidGlass 编译面板</title>
</head>
<body>
  <main>
    <section class="card" aria-label="编译状态">
      <div class="identity">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M6 10h12m-7 3-2 2 2 2m2-4 2 2-2 2M5 3h8"/></svg>
        <div><h1>LiquidGlass</h1><p id="file">选择一个 .tex 文件</p></div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot"></span><span id="phase">等待编译</span>
      </div>
      <div class="progress" id="progress" aria-hidden="true"><i></i><i></i><i></i></div>
      <p id="detail" hidden></p>
      <div class="actions">
        <button class="primary" id="build"><span aria-hidden="true">▶</span> 编译</button>
        <button id="cancel" hidden>停止</button>
        <button id="pdf" hidden>查看 PDF</button>
      </div>
    </section>
    <section class="errors" id="errors" hidden aria-label="编译错误">
      <h2>编译错误</h2>
      <ol id="problems"></ol>
    </section>
    <button class="output" id="output"><span aria-hidden="true">≡</span> 查看底部输出</button>
  </main>
  <script nonce="{{NONCE}}" src="{{JS}}"></script>
</body>
</html>
